<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko"
      th:replace="~{admin/admin_template :: admin_template('AI 상품 설문','AI 상품 설문',~{::content},~{::script})}">

<th:block th:fragment="content">
    <section class="admin-content">
        <section class="survey-admin">
            <div class="survey-admin-header">
                <h2>AI 상품 설문 관리</h2>
                <button type="button" id="openSurveyModal" class="survey-btn-primary">설문 등록</button>
            </div>

            <div class="survey-list" id="surveyList">
                <table class="survey-table">
                    <thead>
                    <tr>
                        <th>ID</th>
                        <th>제목</th>
                        <th>설명</th>
                        <th>활성</th>
                        <th>등록일</th>
                    </tr>
                    </thead>
                    <tbody id="surveyTableBody">
                    <tr>
                        <td colspan="5" class="survey-empty">등록된 설문이 없습니다.</td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </section>

        <div class="survey-modal" id="surveyModal">
            <div class="survey-modal-content">
                <button type="button" class="survey-modal-close" id="closeSurveyModal">×</button>
                <h3>설문 등록</h3>

                <div class="survey-modal-body">
                    <label for="surveyTitle">설문 제목</label>
                    <input type="text" id="surveyTitle" placeholder="설문 제목을 입력하세요" />

                    <label for="surveyDescription">설문 설명</label>
                    <textarea id="surveyDescription" rows="3" placeholder="설문 설명을 입력하세요"></textarea>

                    <label class="survey-checkbox">
                        <input type="checkbox" id="surveyIsActive" checked />
                        활성화
                    </label>

                    <div class="survey-question-section">
                        <div class="survey-question-header">
                            <h4>문항</h4>
                            <button type="button" id="addSurveyQuestion" class="survey-btn-secondary">문항 추가</button>
                        </div>
                        <div id="surveyQuestions"></div>
                    </div>
                </div>

                <div class="survey-modal-footer">
                    <button type="button" class="survey-btn-secondary" id="cancelSurveyModal">취소</button>
                    <button type="button" class="survey-btn-primary" id="submitSurvey">등록</button>
                </div>
            </div>
        </div>
    </section>
</th:block>

<th:block th:fragment="script">
    <script th:src="@{/js/admin_survey.js}"></script>
</th:block>

</html>
